<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azime Home</title>
  <meta name="description" content="Azime Home">
  <style>
    :root { --bg: #fafaf7; --fg: #1f2328; --muted: #5b6470; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14161a; --fg: #e8e6e3; --muted: #9aa3ad; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px; text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Azime Home</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
